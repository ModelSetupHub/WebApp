<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Setup Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Model Setup Hub</span>
      </div>

      <nav class="nav">
        <a href="#system" class="nav-item is-active" data-section="system">System</a>
        <a href="#ollama" class="nav-item" data-section="ollama">Ollama</a>
      </nav>
    </aside>

    <main class="main">

      <section id="system" class="panel-section is-visible">
        <header class="section-head">
          <h1>System</h1>

          <div class="section-actions">
            <span class="scan-meta" id="scan-meta"></span>
            <button type="button" class="btn" id="btn-rescan">Rescan</button>
          </div>
        </header>

        <div class="alert is-hidden" id="system-error" role="alert"></div>

        <div class="card-grid" id="system-cards"></div>

        <div class="subsection">
          <h2 class="subsection-title">Software</h2>
          <div class="spec-table" id="software-specs"></div>
        </div>

        <div class="subsection">
          <h2 class="subsection-title">Hardware</h2>

          <div class="spec-group">
            <h3 class="spec-group-title">Processor</h3>
            <div class="spec-table" id="cpu-specs"></div>
          </div>

          <div class="spec-group">
            <h3 class="spec-group-title">Memory</h3>
            <div class="spec-table" id="memory-specs"></div>
            <div class="tile-list" id="memory-modules"></div>
          </div>

          <div class="spec-group">
            <h3 class="spec-group-title">Graphics</h3>
            <div class="spec-table" id="gpu-specs"></div>
            <div class="tile-list" id="gpu-devices"></div>
          </div>

          <div class="spec-group">
            <h3 class="spec-group-title">Storage</h3>
            <div class="tile-list" id="storage-drives"></div>
          </div>
        </div>
      </section>

      <section id="ollama" class="panel-section">
        <h1>Ollama</h1>

        <div class="model-list" id="model-list"></div>
      </section>

    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
